[package]
name = "cognitive-complexity"
version = "0.1.0"
edition = "2021"
publish = false
description = "Scores every Rust function in the repository by cognitive complexity and fails above the limit"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "3", features = ["full", "visit", "parsing", "printing"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
