name: Native Linux release

# Signs with the updater's minisign key, stored as `TAURI_SIGNING_PRIVATE_KEY`. A `public-key`
# run prints only the public half. A `release` run signs the checked AppImage from a packages run
# on the same commit.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare the public update key, or sign a checked Linux package
        required: true
        default: release
        type: choice
        options: [release, public-key]
      package_run_id:
        description: Successful Native packages run on this commit (for release)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: native-linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare the update key or signed AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install signing and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign squashfs-tools
      - name: Read the existing updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export NR_MINISIGN_KEY="$RUNNER_TEMP/northroom-update.key"
          python3 -I - <<'PY'
          import base64, os, pathlib
          key = os.environ["TAURI_SIGNING_PRIVATE_KEY"].strip().encode()
          if not key.startswith(b"untrusted comment:"):
              try:
                  key = base64.b64decode(key, validate=True)
              except ValueError:
                  raise SystemExit("The stored updater key is not a minisign secret key") from None
          if not key.startswith(b"untrusted comment:"):
              raise SystemExit("The stored updater key is not a minisign secret key")
          pathlib.Path(os.environ["NR_MINISIGN_KEY"]).write_bytes(key)
          PY
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | \
            minisign -R -s "$NR_MINISIGN_KEY" -p "$RUNNER_TEMP/northroom-update.pub"
      - name: Upload the public update key
        uses: actions/upload-artifact@v4
        with:
          name: northroom-linux-update-public-key
          path: ${{ runner.temp }}/northroom-update.pub
          if-no-files-found: error
          retention-days: 30
      - name: Require a checked package from this commit
        if: inputs.operation == 'release'
        env:
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          [[ "$PACKAGE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "A Native packages run ID is required." >&2; exit 1; }
          source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID" --jq .head_sha)
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID" --jq .path)
          [ "$source" = "$GITHUB_SHA" ] && [ "$workflow" = .github/workflows/native-packages.yml ] \
            || { echo "The package must come from Native packages on this source commit." >&2; exit 1; }
          checked=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Linux AppImage") | .conclusion')
          [ "$checked" = success ] || { echo "The Linux AppImage checks have not passed." >&2; exit 1; }
          cmp "$RUNNER_TEMP/northroom-update.pub" apps/native/core/src/update/update-key.pub \
            || { echo "Commit this public key before building the release package." >&2; exit 1; }
          gh run download "$PACKAGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name northroom-linux-appimage --dir "$RUNNER_TEMP/package"
      - name: Sign and verify the release
        if: inputs.operation == 'release'
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/native
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
          name="Northroom-$version-x86_64.AppImage"
          mv "$RUNNER_TEMP/package/$name.NOT-FOR-RELEASE" "$RUNNER_TEMP/package/$name"
          printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | \
            NR_MINISIGN_KEY="$RUNNER_TEMP/northroom-update.key" scripts/release-linux.sh \
              --from "$RUNNER_TEMP/package/$name" "$RUNNER_TEMP/northroom-release"
      - name: Upload the signed release files
        if: inputs.operation == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: northroom-native-linux-${{ github.sha }}
          path: ${{ runner.temp }}/northroom-release/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove the private updater key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/northroom-update.key" ]; then
            rm "$RUNNER_TEMP/northroom-update.key"
          fi
