[package]
name = "webhost"
version = "0.0.0"
edition = "2024"
publish = false
description = "The page host in Rust: live HTML pages and 3D models' stills in the system's web view, off the network"

[lib]
name = "webhost"
path = "src/lib.rs"

[dependencies]
northroom-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mac web view and pictures through objc2's typed framework crates (each
# "Zlib OR Apache-2.0 OR MIT", objc2-foundation MIT).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSGeometry",
    "NSKeyValueCoding",
    "NSNull",
    "NSObject",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSValue",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKContentWorld",
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKPreferences",
    "WKScriptMessage",
    "WKScriptMessageHandler",
    "WKSnapshotConfiguration",
    "WKURLSchemeHandler",
    "WKURLSchemeTask",
    "WKUserContentController",
    "WKUserScript",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWebsiteDataStore",
] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-image-io = "0.3.2"

# Off the Mac (`src/elsewhere`): pictures through the `image` crate GPUI already uses, and each
# platform's own web view behind the Mac's names.
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

# Windows: Edge WebView2 (preinstalled on Windows 10 and 11) through webview2-com (MIT; the
# loader is linked statically, so nothing ships beside the app). The `windows` crate provides the
# hidden windows for main-thread work and the web view, and the memory streams for files and
# pictures.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Linux: WebKitGTK (webkit2gtk-4.1, GTK 3) through gtk-rs (MIT). The web view lives in a window
# that is never shown and runs on the main thread's GLib loop.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
webkit2gtk-sys = "2.0"
soup3 = "0.5"
javascriptcore-rs = "=1.1"
