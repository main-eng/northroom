[package]
name = "northroom-core"
# The app's version, written only here: scripts/bundle.sh puts it in Info.plist.
version = "1.4.0"
edition = "2021"
publish = false
description = "Northroom's native core as one library a platform shell links (ADR-0001)"

[dependencies]
# What a stream's colour tags mean, pixel buffers, and frames shared with the GPU. Media files
# are read through the platform (`src/media`).
northroom-media = { path = "../crates/northroom-media" }
wgpu = { version = "30.0.1", default-features = false, features = ["wgsl"] }
libc = "0.2"
alacritty_terminal = "0.26"
# The emulator's own poller, named here to stand in front of its process reader.
polling = "3.8"
# Already in the tree under the emulator: which characters an input method composes two cells
# wide (`terminal::frame`).
unicode-width = "0.2"
uuid = { version = "1.29.2", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
notify = "8.2.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
# Compress's zip archives (`archive`): deflate and the CRC-32 the format needs, its Rust
# backend (miniz_oxide). Already in the tree through the pictures' PNG reader, at this version.
flate2 = "1.1.11"
# A workbook's zip entries inflated (`workbook`): flate2's own Rust backend, read directly so its
# output never wraps and a match reaching back before a part's first byte is refused.
miniz_oxide = "0.9.1"
# The Linux update's minisign signature (`update/signature.rs`): MIT, no dependencies of its own;
# Ed25519 and BLAKE2b are not written here (Tauri's updater checks its files with it too).
minisign-verify = "0.3"
# The app's faces read and words set in them by the core itself (`typeface`), alike on every
# platform: WOFF2's compressed tables, the font tables, and HarfRust's glyph substitution (all
# Apache-2.0 or MIT; read-fonts and HarfRust are already in the GPUI shell's tree).
brotli-decompressor = "5"
read-fonts = "0.41"
# A font file's glyph outlines for its specimen (`deck::font`), TrueType and CFF alike: the
# outline reader built on read-fonts (MIT or Apache-2.0; in the GPUI shell's tree, at this
# version). Writing a CFF charstring interpreter ourselves would duplicate it.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# Encrypted PDFs (`pdf::crypt`): the standard security handler's MD5, AES and SHA-2, from
# RustCrypto (MIT or Apache-2.0; in the GPUI shell's tree, at these versions). Hand-written
# ciphers would be the riskier code to keep.
md-5 = { version = "0.10", default-features = false }
aes = "0.8"
sha2 = { version = "0.10", default-features = false }
# Decodes a JPEG on a PDF page that is see-through, masked or clipped to a shape, so it is
# drawn into the page (`pdf::image`): MIT, Apache-2.0 or Zlib; in the GPUI shell's tree, at this
# version, through GPUI's `image`.
zune-jpeg = "0.5"
# Scanned pages in PDFs (`pdf::image`): CCITT fax (MIT; in the shell's tree, at this version,
# through `tiff`), and JBIG2 and JPEG 2000 from the hayro PDF project (Apache-2.0 or MIT, pure
# Rust). Each is a format of its own; writing their decoders ourselves would be weeks each.
fax = "0.2"
hayro-jbig2 = { version = "0.4", default-features = false, features = ["std", "simd"] }
hayro-jpeg2000 = { version = "0.5", default-features = false, features = ["std", "simd"] }
harfrust = "0.12"
# Where a line may break (`typeset`): ICU4X's rules, the Unicode rules Core Text breaks lines
# by (Unicode-3.0; in the GPUI shell's tree).
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }

# Each platform's GPU backend: Metal on a Mac, Direct3D 12 on Windows, Vulkan on Linux (the
# GPUI shell's Windows and Linux builds, ADR "One GPUI shell for Mac, Windows and Linux").
[target.'cfg(target_os = "macos")'.dependencies]
# AVFoundation's classes, for the Mac media backend (`src/media/apple`).
objc2 = "0.6"
wgpu = { version = "30.0.1", default-features = false, features = ["metal"] }

# The reader of picture files' sizes off a Mac (`src/media/picture`), the one the GPUI shell
# draws them with there (already in its tree).
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["dx12"] }
# Media Foundation, for the Windows media backend (`src/media/windows`), and the Windows Imaging
# Component, which reads picture files there (`src/media/windows/picture.rs`).
# And the environment Windows gives the signed-in person afresh, a terminal's
# (`src/terminal/launch.rs`): their token and `CreateEnvironmentBlock`.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Environment", "Win32_System_Threading", "Win32_System_Variant"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan"] }
# GStreamer, the system's media framework, for the Linux media backend (`src/media/linux`).
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-pbutils = "0.25"
# The colour names of GStreamer 1.18 and later (PQ, HLG, Display P3).
gstreamer-video = { version = "0.25", features = ["v1_18"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 1

# The message catalogs read by build.rs into the string table (`strings/`).
[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
